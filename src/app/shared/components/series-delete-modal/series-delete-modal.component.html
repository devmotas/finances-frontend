@if (visible()) {
  <div class="modal__backdrop" (click)="backdropClick($event)" role="presentation">
    <div
      class="modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="series-delete-title"
      aria-describedby="series-delete-desc"
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      (click)="$event.stopPropagation()"
    >
      <div class="modal__head">
        <h2 id="series-delete-title" class="modal__title">
          {{ isSeries() ? 'Excluir lançamento da série' : 'Excluir lançamento' }}
        </h2>
        <button type="button" class="modal__x" (click)="cancel()" [disabled]="isDeleting()" aria-label="Fechar">
          <lucide-icon name="x" [size]="22" [strokeWidth]="2"></lucide-icon>
        </button>
      </div>

      <div id="series-delete-desc" class="modal__text">
        <p class="modal__question">Excluir {{ itemLabel() }}?</p>
        @if (isSeries()) {
          <p class="modal__detail">Ele faz parte de uma série fixa. Escolha até onde excluir.</p>
        }
      </div>

      @if (isSeries()) {
        <div class="scope-options" role="group" aria-label="Até onde excluir">
          <button
            type="button"
            class="scope-option"
            [appBusyButton]="isDeletingScope(scope.thisMonth)"
            [busyLabel]="deletingLabel"
            [disabled]="isDeleting()"
            (click)="deleteThisMonth()"
          >
            <span class="scope-option__title">Só este mês</span>
            <span class="scope-option__hint">Os outros meses da série continuam.</span>
          </button>
          <button
            type="button"
            class="scope-option scope-option--danger"
            [appBusyButton]="isDeletingScope(scope.thisAndFuture)"
            [busyLabel]="deletingLabel"
            [disabled]="isDeleting()"
            (click)="deleteThisAndFuture()"
          >
            <span class="scope-option__title">Este e os próximos</span>
            <span class="scope-option__hint">Apaga este mês e todos os seguintes da série.</span>
          </button>
        </div>
      }

      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" cdkFocusInitial [disabled]="isDeleting()" (click)="cancel()">
          Cancelar
        </button>
        @if (!isSeries()) {
          <button
            type="button"
            class="btn btn--danger"
            [appBusyButton]="isDeletingScope(scope.thisMonth)"
            [busyLabel]="deletingLabel"
            [disabled]="isDeleting()"
            (click)="deleteThisMonth()"
          >
            Excluir
          </button>
        }
      </div>
    </div>
  </div>
}
